<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- App-like viewport: no zoom, full screen under notch, keyboard-aware -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta name="theme-color" content="#090B18" />
  <meta name="description" content="BELVIA CHAT — Connect Beyond Boundaries." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>BELVIA CHAT</title>

  <style>
    /* Fullscreen app shell: the page never scrolls, only chat areas do */
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #090B18;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Keep typing and selecting working in inputs */
    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }

    #root {
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <noscript>BELVIA CHAT needs JavaScript to run.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
    </html>
